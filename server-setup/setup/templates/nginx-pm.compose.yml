services:
  nginx-pm:
    image: jc21/nginx-proxy-manager:${NGINX_PM_VERSION:-latest}
    container_name: nginx-pm
    restart: ${RESTART_POLICY}
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_ADMIN_PORT}:81"
      - "${NGINX_HTTPS_PORT}:443"
    environment:
      TZ: ${TZ}
    volumes:
      - "${DOCKER_SETUP_DIR}/nginx-pm/data:/data"
      - "${DOCKER_SETUP_DIR}/nginx-pm/letsencrypt:/etc/letsencrypt"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    name: ${APP_NETWORK}
